name: build

on:
  push:
  pull_request:

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio==6.2.0
      - name: Unit tests (host)
        run: pio test -e native
      - name: Firmware
        run: pio run -e sda_s3_touch_128
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            .pio/build/sda_s3_touch_128/firmware.bin
            .pio/build/sda_s3_touch_128/bootloader.bin
            .pio/build/sda_s3_touch_128/partitions.bin
