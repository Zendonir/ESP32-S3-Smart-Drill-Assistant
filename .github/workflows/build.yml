name: build

on:
  push:
  pull_request:

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio==6.2.0
      - name: Font/LVGL render check (host)
        run: scripts/check_fonts.sh
      - name: Unit tests (host)
        run: pio test -e native
      - name: Firmware
        run: pio run -e sda_s3_touch_128
      - name: Versioned OTA image
        run: |
          V=$(sed -n 's/.*SDA_FW_VERSION_STR "\(.*\)".*/\1/p' include/Version.h)
          cp .pio/build/sda_s3_touch_128/firmware.bin .pio/build/sda_s3_touch_128/firmware-$V.bin
          echo "FW_VERSION=$V" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ env.FW_VERSION }}
          path: |
            .pio/build/sda_s3_touch_128/firmware-${{ env.FW_VERSION }}.bin
            .pio/build/sda_s3_touch_128/firmware.bin
            .pio/build/sda_s3_touch_128/bootloader.bin
            .pio/build/sda_s3_touch_128/partitions.bin
