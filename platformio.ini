; Smart Drill Assistant - PlatformIO configuration
;
; Target: Waveshare ESP32-S3-Touch-LCD-1.28 (ESP32-S3R2: 2 MB quad PSRAM, 16 MB QIO flash)
; Framework: Arduino-ESP32 2.0.17 (ESP-IDF 4.4.7) via platform espressif32 6.9.0
;
; All third party libraries are pinned to exact release tags (see docs/Dependencies.md).

[platformio]
default_envs = sda_s3_touch_128

[common]
lib_deps_firmware =
    https://github.com/lvgl/lvgl.git#v8.3.11
    https://github.com/lovyan03/LovyanGFX.git#1.1.16
    https://github.com/bblanchon/ArduinoJson.git#v7.2.1
    https://github.com/Links2004/arduinoWebSockets.git#2.6.1
    ; built-in libraries of the Arduino-ESP32 core (resolved locally, listed so that
    ; the library dependency finder links them for WebSockets as well)
    WiFi
    WiFiClientSecure
    WebServer
    Update
    Preferences
    FS
    LittleFS
    ESPmDNS
    DNSServer
build_flags_firmware =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -Iinclude
    ; arduinoWebSockets includes <WiFi.h> behind macros the LDF cannot evaluate
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/WiFi/src
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/WiFiClientSecure/src
    -Wall

[env:sda_s3_touch_128]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_unflags = -std=gnu++11
build_flags =
    ${common.build_flags_firmware}
    -DCORE_DEBUG_LEVEL=1
lib_deps = ${common.lib_deps_firmware}
lib_ldf_mode = chain+
extra_scripts = pre:scripts/embed_web.py

; Same firmware with verbose logging and assertion checks
[env:sda_s3_touch_128_debug]
extends = env:sda_s3_touch_128
build_type = debug
build_flags =
    ${common.build_flags_firmware}
    -DCORE_DEBUG_LEVEL=4
    -DSDA_DEBUG_BUILD=1

; Host unit tests of the hardware independent measurement library (lib/DrillCore)
;   pio test -e native
[env:native]
platform = native
test_framework = unity
test_build_src = no
build_flags = -std=c++17 -Wall -Wextra -lm
